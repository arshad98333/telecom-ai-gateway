[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telecom-mcp-tools"
version = "1.2.0"
description = "Security-enforcing MCP tool server for telecom customer support agents: OIDC/JWKS identity, role-based scopes, per-call authorization, idempotent writes and a tamper-evident audit trail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Arshad", email = "arshad@arshadify.online" }]
keywords = ["mcp", "model-context-protocol", "telecom", "agent", "tools", "auth0", "oidc", "rbac"]
# No `classifiers` list. Trove classifiers exist for PyPI/Warehouse's own search and
# filter UI; nothing from this repository is published to an index, so they would be
# metadata for a shopfront that never sees it.
dependencies = [
  "mcp>=1.9,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<0.29",
  "pyjwt[crypto]>=2.9,<3",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
redis = ["redis>=5.0,<7"]
http = ["uvicorn>=0.30,<1", "starlette>=1.3.1,<2"]
# Tracing is an extra, not a dependency. The package must install and run on a laptop
# without pulling a vendor SDK, and observability/tracing.py imports these lazily so a
# missing extra is a configuration error at startup rather than an ImportError.
otel = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
azure-monitor = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "azure-monitor-opentelemetry-exporter>=1.0.0b28,<2",
]

[project.scripts]
telecom-mcp = "telecom_mcp.api.cli:main"

[project.urls]
Homepage = "https://github.com/arshad98333/telecom-ai-gateway"
Documentation = "https://github.com/arshad98333/telecom-ai-gateway/blob/main/telecom-mcp/README.md"
Repository = "https://github.com/arshad98333/telecom-ai-gateway"
Changelog = "https://github.com/arshad98333/telecom-ai-gateway/blob/main/telecom-mcp/CHANGELOG.md"
Issues = "https://github.com/arshad98333/telecom-ai-gateway/issues"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5.0,<7",
  "pytest-randomly>=3.15,<4",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-redis>=4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_mcp"]
artifacts = ["src/telecom_mcp/adapters/fixtures/*.json"]

[tool.hatch.build.targets.sdist]
# Named explicitly rather than left to the default. An sdist built from a working
# directory picks up whatever is sitting in it, and the one thing that must never reach
# a public index is a populated .env - so the include list is a allow-list and the
# excludes below are a second, unconditional refusal on top of it.
include = ["src", "tests", "docs", "Makefile", "README.md", "CHANGELOG.md", "LICENSE"]
exclude = [
  # Never, under any circumstances, and regardless of what `include` says.
  ".env",
  ".env.*",
  "!.env.example",
  "**/.env",
  "**/.env.*",
  # Deployment templates for one particular cloud. They belong in the repository, not
  # in something a stranger downloads to build the package.
  "infra",
  ".gitignore",
  "**/__pycache__",
]

[tool.hatch.build.targets.wheel.force-include]
# Nothing. Listed so that adding a data file is a deliberate edit here rather than a
# side effect of where someone happened to put it.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "S", "ASYNC", "DTZ", "BLE", "PTH", "T20", "RET", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ARG002"]
# Command-line tools. Printing is their output, and they add src/ to the path before
# importing the package, which is what E402 exists to complain about.
"scripts/**" = ["T20", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
follow_untyped_imports = false

# Validation tests deliberately hand wrong types to the models to prove they are
# rejected at runtime, which is exactly what a static checker would forbid. Scoped to
# this one error code so every other strictness rule still applies to the tests.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["arg-type", "call-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = ["integration: needs a containerised dependency"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/telecom_mcp"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  # Protocol bodies are declarations, not code that can run.
  "^\\s*\\.\\.\\.$",
  "^class .*\\(Protocol\\):",
]
