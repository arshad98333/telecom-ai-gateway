name: cd-production

# Promotion, not delivery. Nothing is built here.
#
#   staging ──PR (fast-forward)──► production ──approval──► same digest ──► PRODUCTION
#
# The digest is looked up by commit sha, which is what makes the promise enforceable
# rather than aspirational: if this commit never went through staging, there is no image
# tagged for it, the lookup fails, and the deployment does not happen. Somebody pushing
# straight to `production` gets a failed workflow instead of an untested release.

on:
  push:
    branches: [production]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit sha to promote. Defaults to the head of production."
        type: string
        required: false

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: telecom-mcp-tools
  APP_NAME: telecom-mcp-production

jobs:
  # --- Find the artifact staging ran. No build step exists in this file. ----------
  resolve:
    runs-on: ubuntu-24.04
    environment: staging    # read-only use: the registry lives beside staging
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.find.outputs.image }}
      digest: ${{ steps.find.outputs.digest }}
      revision: ${{ steps.find.outputs.revision }}
      commit: ${{ steps.find.outputs.commit }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: find
        name: The digest staging ran, or nothing
        run: |
          set -euo pipefail
          commit="${{ inputs.commit || github.sha }}"

          digest="$(az acr manifest show \
            --name "${{ vars.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:sha-${commit}" \
            --query digest -o tsv 2>/dev/null || true)"

          if [ -z "$digest" ]; then
            echo "::error title=Never staged::No image is tagged sha-${commit}." \
                 "That commit was never built by cd-staging, so it has never run in" \
                 "staging. Merge it into staging first; production only promotes."
            exit 1
          fi

          echo "commit=$commit"   >> "$GITHUB_OUTPUT"
          echo "digest=$digest"   >> "$GITHUB_OUTPUT"
          echo "revision=c$(echo "$commit" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}@${digest}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Promoting::${{ env.IMAGE_NAME }}@${digest}"

      - name: Say plainly what is about to be promoted
        run: |
          {
            echo "### Promoting"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ steps.find.outputs.commit }}\` |"
            echo "| digest | \`${{ steps.find.outputs.digest }}\` |"
            echo ""
            echo "These are the exact bytes staging has been running."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Production. The environment's reviewers are the gate. ----------------------
  deploy:
    needs: resolve
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remember the revision currently taking traffic
        id: current
        run: |
          set -euo pipefail
          # Captured before anything changes. Reading it after a failed deployment
          # means reading it from a system that is already in the state we are trying
          # to escape.
          previous="$(az containerapp revision list --name "${{ env.APP_NAME }}" \
            --resource-group '${{ vars.RESOURCE_GROUP }}' \
            --query "sort_by([?properties.active && properties.trafficWeight>\`0\`], \
                     &properties.createdTime)[-1].name" -o tsv || true)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "::notice title=Rollback target::${previous:-none}"

      - id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP }}
          template: infra/azure/main.bicep
          parameters: >-
            environmentName=production
            image=${{ needs.resolve.outputs.image }}
            revisionSuffix=${{ needs.resolve.outputs.revision }}
            registryServer=${{ vars.REGISTRY_SERVER }}
            registryResourceId=${{ vars.REGISTRY_RESOURCE_ID }}
            keyVaultName=${{ vars.KEY_VAULT_NAME }}
            backendBaseUrl=${{ vars.BACKEND_BASE_URL }}
            jwksUrl=${{ vars.JWKS_URL }}
            jwtIssuer=${{ vars.JWT_ISSUER }}
            jwtAudience=${{ vars.JWT_AUDIENCE }}
            claimNamespace=${{ vars.CLAIM_NAMESPACE }}
            serviceTokenUrl=${{ vars.SERVICE_TOKEN_URL }}
            serviceClientId=${{ vars.SERVICE_CLIENT_ID }}
          failOnStdErr: false

      - name: The deployed revision must become ready
        run: .github/scripts/verify_deployment.sh "${{ steps.deploy.outputs.url }}"

      - name: The guardrails and the tracing must actually be on
        run: .github/scripts/verify_posture.sh "${{ steps.deploy.outputs.url }}"

      - name: Return traffic to the previous revision if it did not
        if: failure()
        run: |
          set -euo pipefail
          previous='${{ steps.current.outputs.previous }}'
          if [ -z "$previous" ]; then
            echo "::error title=Rollback::there was no previous revision to fall back to"
            exit 1
          fi
          az containerapp ingress traffic set --name "${{ env.APP_NAME }}" \
            --resource-group '${{ vars.RESOURCE_GROUP }}' \
            --revision-weight "$previous=100"
          echo "::warning title=Rolled back::traffic returned to $previous"
          {
            echo "### Rolled back"
            echo ""
            echo "The new revision never became ready. Traffic is back on \`$previous\`."
            echo "Fix on \`development\` and promote again; do not deploy forward."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- The alerts are part of the release, not a thing somebody does afterwards. ---
  alerts:
    needs: [resolve, deploy]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply the alert rules generated from the objectives
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.RESOURCE_GROUP }}
          template: infra/observability/alerts.bicep
          parameters: >-
            environmentName=production
            applicationInsightsId=${{ vars.APPLICATION_INSIGHTS_ID }}
            actionGroupId=${{ vars.ACTION_GROUP_ID }}
          failOnStdErr: false
