# The MongoDB suite, on every merge request.
#
# These 43 tests are deselected from `make check` because they need a real replica set:
# the transactional outbox commits atomically and the supervisor's live feed reads a
# change stream, and neither works against a standalone mongod. Left to a developer's
# laptop that meant they ran when someone remembered, which is the same as not running.
#
# The replica set here is ephemeral - created for the job, thrown away with the runner -
# so a test that leaves rubbish behind cannot poison the next run, and no shared cluster
# needs credentials in CI.

name: mongo

# Runs on a push to any branch, like ci.yml -- but with a paths filter, which ci.yml does
# not need and this does. This job starts a real MongoDB replica set and takes a couple
# of minutes, and `cancel-in-progress: false` below means a superseded run is never
# killed. Without a filter, every push to every branch -- a README fix, a workflow tweak
# -- would queue an unskippable replica-set run behind the last one.
#
# The filter lists everything that can change this job's answer and nothing else: the
# middleware, which is the only code under test; the compose file that defines the
# replica set; and this workflow. A change anywhere else cannot make these 43 tests fail
# differently, so running them would tell nobody anything.
#
# The list is written out twice because GitHub Actions does not support YAML anchors.
# Keep the two copies identical.

on:
  pull_request:
    paths:
      - "telecom-middleware/**"
      - "docker-compose.yml"
      - ".github/workflows/mongo.yml"
  push:
    branches: ['**']
    paths:
      - "telecom-middleware/**"
      - "docker-compose.yml"
      - ".github/workflows/mongo.yml"
  workflow_dispatch:

concurrency:
  group: mongo-${{ github.ref }}
  # Keep every run's result. The Mongo job is short enough that cancelling in-progress
  # runs creates more noise than it saves, and GitHub reports those cancellations as red.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  replica-set:
    name: middleware against a real replica set
    # A push to a branch here and a PR opened from it are two events for one commit.
    # Skip the pull_request run when the PR is from this repository; a fork's PR still
    # runs, because its push happened on the fork where this workflow did not fire.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only the one variable the contract fixture reads. Application configuration does
    # not belong at job level: every test in the run inherits it, and the six that assert
    # the safe defaults are entitled to an empty environment. load_settings() now ignores
    # the ambient environment when it is handed a mapping, and this keeps the job honest
    # regardless.
    env:
      TELECOM_MW_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=false

    steps:
      - uses: actions/checkout@v7

      # The compose file's mongo service already initiates rs0 in its healthcheck and
      # reports healthy only once a primary has been elected. Reusing it means CI and a
      # laptop stand up the same thing, rather than two definitions that drift.
      - name: Start the replica set
        run: docker compose up -d --wait --wait-timeout 180 mongo

      - name: Show what we are testing against
        run: |
          docker compose exec -T mongo mongosh --quiet --eval \
            'JSON.stringify({set: rs.status().set, primary: rs.isMaster().primary, version: db.version()})'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: telecom-middleware/uv.lock

      - name: Install
        working-directory: telecom-middleware
        run: uv sync --frozen --all-extras

      # Two steps, because they answer two questions and a combined command answers
      # neither well.
      #
      # First: did the 43 deselected tests actually run, and pass? -m mongo selects only
      # those, so an empty selection is a failure rather than a pass - --strict-markers
      # catches a renamed marker and the exit-5 check catches a suite that collected
      # nothing. No coverage here: 43 tests against one adapter cannot reach the 95%
      # bar and asking them to is how a real failure gets buried under a coverage error.
      - name: Run the MongoDB suite
        working-directory: telecom-middleware
        shell: bash
        run: |
          status=0
          uv run pytest tests -m mongo --strict-markers --junitxml=junit-mongo.xml || status=$?
          if [ "$status" -eq 5 ]; then
            echo "::error::No tests matched -m mongo. The marker moved, or the suite is not being collected."
            exit 1
          fi
          exit "$status"

      # Second: the coverage gate, with the adapter included. `make cov-mongo` runs the
      # whole suite - mongo and not-mongo - against the same 95% bar the fast run holds,
      # with repositories/mongo.py no longer omitted. This is the only run in which that
      # file is measured at all.
      - name: Coverage, with the MongoDB adapter included
        working-directory: telecom-middleware
        run: make cov-mongo

      - name: Mongo logs, if that failed
        if: failure()
        run: docker compose logs --no-color mongo | tail -n 200

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mongo-results
          path: |
            telecom-middleware/junit-mongo.xml
            telecom-middleware/coverage.xml
          if-no-files-found: warn

      - name: Tear the replica set down
        if: always()
        run: docker compose down -v
