name: release

# Container-only production release. PyPI/TestPyPI are deliberately not part of this
# repo's deployment path: the MCP server and middleware are shipped as images.

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: telecom-mcp
            image: telecom-mcp-tools
            port: "8080"
            secret_env: TELECOM_MCP_LOCAL_VERIFIER_SECRET
          - service: telecom-middleware
            image: telecom-middleware
            port: "9000"
            secret_env: TELECOM_MW_LOCAL_VERIFIER_SECRET

    steps:
      - uses: actions/checkout@v6

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${owner}/${{ matrix.image }}"
          short_sha="${GITHUB_SHA::12}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: The image must boot and expose operations endpoints
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.service }}-release-smoke-${GITHUB_RUN_ID}"
          port="${{ matrix.port }}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$name" -p "${port}:${port}" \
            -e "${{ matrix.secret_env }}=release-check-secret-long-enough-32" \
            -e TELECOM_MCP_HTTP_HOST=0.0.0.0 \
            -e TELECOM_MW_HTTP_HOST=0.0.0.0 \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}" >/dev/null

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/readyz" >/dev/null; then
              curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null
              curl -fsS "http://127.0.0.1:${port}/metrics" >/dev/null
              exit 0
            fi
            sleep 1
          done

          docker logs "$name"
          exit 1

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:production
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Published digest
        run: echo "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
