name: ci

# GitHub only runs workflows in the repository root, so this is the pipeline for both
# services. Each service keeps its own .github/ for when it is used standalone; those
# files do not run from here, which is why this exists rather than duplicating them.
#
# Every job calls the same make target a developer runs, so nothing can pass locally
# and fail here for a reason nobody can reproduce.
#
# Runs on a push to any branch, not just the four long-lived ones: work in progress is
# exactly what most needs checking, and waiting for a pull request to find out means
# finding out late. `'**'` is branches only -- a bare `push:` would also fire on tags,
# and a tag is not a branch of work.
#
# Every job carries the same guard against running twice. A push to a branch in this
# repository and a pull request opened from that branch are two events for one commit,
# so the pull_request run is skipped when the PR comes from this repository. A fork's
# PR still runs: its push happened on the fork, where this workflow did not fire.

on:
  push:
    branches: ['**']
  # Kept to the long-lived branches: this is the *target* of the PR, and the only PRs
  # this trigger still serves are ones from forks (see the guard above).
  pull_request:
    branches: [development, staging, production, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Keep every pushed run visible. Cancelling older runs paints them red in Actions,
  # which made successful fixes look like failures while a newer commit was already
  # running.
  cancel-in-progress: false

permissions:
  contents: read

# setup-uv is pinned to a commit SHA with the version in a trailing comment, while every
# other action here uses a floating major tag. That is not an inconsistency to tidy up:
# astral-sh/setup-uv stopped publishing major and minor tags at v8.0.0, deliberately, so
# `@v9` and `@v10` do not exist as refs and a run using one fails to resolve the action
# before it does anything. Only a full version or a SHA works, and the SHA is what the
# action's own release notes recommend, because a version tag can still be moved and a
# commit cannot. Dependabot reads the trailing comment and bumps both together.
#
# UV_VERSION below is the version of the uv *binary* the action installs -- unrelated to
# the action's own version, and still a valid input.
env:
  UV_VERSION: "0.12.3"

jobs:
  check:
    name: ${{ matrix.service }} (py${{ matrix.python }})
    # See the header: skips the duplicate run when the PR is from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [telecom-mcp, telecom-middleware, telecom-mcp-client]
        # All three are supported, so all three are tested. Testing only some is how a
        # supported version quietly stops working.
        #
        # The list matches what every service's `requires-python` claims (>=3.11,<3.14)
        # rather than stopping short of it. 3.13 was claimed by all three packages and
        # by telecom-mcp's README, and tested by none of them, which is the same gap in
        # a different place.
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    # make check calls plain `uv run`. Without these, uv resolves the interpreter
    # from its own default rather than the one just synced, decides the existing
    # environment is wrong, and rebuilds it - dropping the extras with it, so the
    # optional tracing exporters vanish and mypy fails on py3.11 only. Setting both
    # here makes every `uv run` in the Makefile agree with the sync above.
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_ALL_EXTRAS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.service }}/uv.lock

      - name: Install from the lock file
        run: uv sync --frozen --all-extras --python ${{ matrix.python }}

      - name: Fail if the lock file is out of date
        run: uv lock --check

      - name: Lint, types, tests, coverage
        run: make check

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.service }}-py${{ matrix.python }}
          path: ${{ matrix.service }}/coverage.xml
          if-no-files-found: warn

  # The README promises three commands. This is the job that keeps that promise true.
  quickstart:
    name: quickstart
    # See the header: skips the duplicate run when the PR is from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: make setup, from a clean clone
        run: make setup
      - name: ...and it is safe to run twice
        run: make setup

  contract:
    name: end to end
    # See the header: skips the duplicate run when the PR is from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: e2e/uv.lock
      # Both services in one process over a real HTTP transport, nothing stubbed
      # between them. A renamed field or a permission that no longer lines up fails
      # here rather than in staging.
      - run: uv sync --frozen
        working-directory: e2e
      - run: uv run pytest
        working-directory: e2e

  security:
    name: security
    # See the header: skips the duplicate run when the PR is from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the secret scan reads history, not just the diff

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Dependency vulnerability audit
        run: make audit

      # The pinned binary rather than gitleaks-action, so the command here is the
      # same one a developer runs locally and the version cannot move underneath us.
      # .gitleaks.toml keeps the upstream rule set and allowlists specific values.
      - name: Secret scan of the whole history
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      # bandit.yaml disables two noise classes with written reasons and leaves every
      # other rule live; the two remaining exceptions are marked in the code.
      - name: Static security analysis
        run: |
          uv run --with bandit bandit -c bandit.yaml -r telecom-mcp/src telecom-middleware/src telecom-mcp-client/src -q

  container:
    name: container (${{ matrix.service }})
    # See the header: skips the duplicate run when the PR is from this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [telecom-mcp, telecom-middleware]
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and prove it answers readiness
        working-directory: ${{ matrix.service }}
        run: make docker-smoke
