name: ci

# GitHub only runs workflows in the repository root, so this is the pipeline for both
# services. Each service keeps its own .github/ for when it is used standalone; those
# files do not run from here, which is why this exists rather than duplicating them.
#
# Every job calls the same make target a developer runs, so nothing can pass locally
# and fail here for a reason nobody can reproduce.

on:
  push:
    branches: [development, staging, production, main]
  pull_request:
    branches: [development, staging, production, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.3"

jobs:
  check:
    name: ${{ matrix.service }} (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [telecom-mcp, telecom-middleware]
        # Both are supported, so both are tested. Testing only one is how a supported
        # version quietly stops working.
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    # make check calls plain `uv run`. Without these, uv resolves the interpreter
    # from its own default rather than the one just synced, decides the existing
    # environment is wrong, and rebuilds it - dropping the extras with it, so the
    # optional tracing exporters vanish and mypy fails on py3.11 only. Setting both
    # here makes every `uv run` in the Makefile agree with the sync above.
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_ALL_EXTRAS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.service }}/uv.lock

      - name: Install from the lock file
        run: uv sync --frozen --all-extras --python ${{ matrix.python }}

      - name: Fail if the lock file is out of date
        run: uv lock --check

      - name: Lint, types, tests, coverage
        run: make check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}-py${{ matrix.python }}
          path: ${{ matrix.service }}/coverage.xml
          if-no-files-found: warn

  # The README promises three commands. This is the job that keeps that promise true.
  quickstart:
    name: quickstart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - name: make setup, from a clean clone
        run: make setup
      - name: ...and it is safe to run twice
        run: make setup

  contract:
    name: end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: e2e/uv.lock
      # Both services in one process over a real HTTP transport, nothing stubbed
      # between them. A renamed field or a permission that no longer lines up fails
      # here rather than in staging.
      - run: uv sync --frozen
        working-directory: e2e
      - run: uv run pytest
        working-directory: e2e

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the secret scan reads history, not just the diff

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Dependency vulnerability audit
        run: make audit

      # The pinned binary rather than gitleaks-action, so the command here is the
      # same one a developer runs locally and the version cannot move underneath us.
      # .gitleaks.toml keeps the upstream rule set and allowlists specific values.
      - name: Secret scan of the whole history
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      # bandit.yaml disables two noise classes with written reasons and leaves every
      # other rule live; the two remaining exceptions are marked in the code.
      - name: Static security analysis
        run: |
          uv run --with bandit bandit -c bandit.yaml -r telecom-mcp/src telecom-middleware/src -q

  container:
    name: container (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [telecom-mcp, telecom-middleware]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and prove it answers readiness
        working-directory: ${{ matrix.service }}
        run: make docker-smoke
