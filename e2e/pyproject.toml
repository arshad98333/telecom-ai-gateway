[project]
name = "telecom-e2e"
version = "1.0.0"
description = "End-to-end proof that the tool server, the middleware and the store work together."
requires-python = ">=3.11,<3.14"
dependencies = [
  "telecom-mcp-tools",
  "telecom-middleware",
  "httpx>=0.27,<0.29",
  "pyjwt[crypto]>=2.9,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pytest-randomly>=3.15,<4", "ruff>=0.6,<1"]

# Both services are consumed from the working tree, so this suite always runs against
# what is committed here rather than against whatever happens to be published.
[tool.uv.sources]
telecom-mcp-tools = { path = "../telecom-mcp", editable = true }
telecom-middleware = { path = "../telecom-middleware", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
addopts = "-q --strict-markers"
