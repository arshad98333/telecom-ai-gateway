[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telecom-mcp-client"
version = "0.1.0"
description = "A production-shaped reference/ops client for telecom-mcp's streamable-HTTP MCP endpoint."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Arshad", email = "arshad@arshadify.online" }]
dependencies = [
  "httpx>=0.27,<0.29",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
cli = []

[project.scripts]
telecom-mcp-client = "telecom_mcp_client.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_mcp_client"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "S", "ASYNC", "DTZ", "BLE", "PTH", "T20", "RET", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["arg-type", "call-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/telecom_mcp_client"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
