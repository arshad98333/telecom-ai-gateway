[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "telecom-middleware"
version = "1.0.0"
description = "Telecom customer data and approval service: the only writer to MongoDB."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "AI Platform Engineering" }]

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "motor>=3.6,<4",
  "pymongo>=4.9,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyjwt[crypto]>=2.9,<3",
  "httpx>=0.27,<0.29",
  "structlog>=24.4,<26",
  "argon2-cffi>=23.1,<26",
]

[project.scripts]
telecom-middleware = "telecom_middleware.api.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5.0,<7",
  "pytest-randomly>=3.15,<4",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_middleware"]
artifacts = ["src/telecom_middleware/repositories/fixtures/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "S", "ASYNC", "DTZ", "BLE", "PTH", "T20", "RET", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["motor.*", "pymongo.*"]
ignore_missing_imports = true

# Validation tests hand wrong types to the models on purpose, to prove they are
# rejected at runtime. Scoped to these two codes so every other rule still applies.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["arg-type", "call-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Mongo-backed tests are deselected by default rather than skipped: a deselection is
# visible in the run header, a skip is an invisible failure. CI runs them with -m mongo
# against a real replica set.
addopts = '-q --strict-markers --strict-config -m "not mongo"' 
markers = ["mongo: requires a real MongoDB replica set (TELECOM_MW_MONGODB_URI)"]
filterwarnings = ["error", "ignore::DeprecationWarning:motor.*"]

[tool.coverage.run]
branch = true
source = ["src/telecom_middleware"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "^\\s*\\.\\.\\.$",
  "^class .*\\(Protocol\\):",
]
